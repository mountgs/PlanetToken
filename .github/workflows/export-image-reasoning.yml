name: Export verified image reasoning release
on:
  push:
    branches: [codex/fix-image-reasoning-20261110]
    paths: [.github/workflows/export-image-reasoning.yml]
permissions:
  contents: write
  packages: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE: 5cf1963ebffbfd5600087a52f0cc005a464c756e
      VERSION: image-reasoning-20261110-5cf1963eb
      GH_REPO: mountgs/PlanetToken
    steps:
      - name: Wait for verified image build
        run: |
          for attempt in $(seq 1 100); do
            STATE=$(gh api repos/$GH_REPO/actions/runs/42770671756 --jq '.status')
            if [ "$STATE" = completed ]; then
              RESULT=$(gh api repos/$GH_REPO/actions/runs/42770671756 --jq '.conclusion')
              test "$RESULT" = success
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Authenticate image export
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export exact verified image
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/mountgs/planet-token:$VERSION
          docker pull "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE"
          docker image inspect "$IMAGE" > image-manifest.json
          docker save "$IMAGE" | gzip -1 > "$VERSION.tar.gz"
          sha256sum "$VERSION.tar.gz" image-manifest.json > SHA256SUMS
      - name: Publish deployment bundle
        run: |
          gh release create "$VERSION" "$VERSION.tar.gz" image-manifest.json SHA256SUMS --target "$SOURCE" --title 'Codex image reasoning compatibility fix' --notes 'Restores image generation by letting upstream select compatible reasoning defaults. Includes the exact tested linux/amd64 image and SHA256 checksums.'
