name: Publish verified upstream sync image

on:
  push:
    branches: [codex/deploy-20261029]
    paths: [.github/workflows/ghcr-upstream-sync-20261029.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-upstream-sync-20261029
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified application source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 8a9605a0bf1d00dcf1019ab7dfc905609fa618ee
      - name: Set image version
        run: printf '%s' 'upstream-sync-20261029-8a9605a0b' > VERSION
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish production architecture
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mountgs/planet-token:upstream-sync-20261029-8a9605a0b
          labels: |
            org.opencontainers.image.source=https://github.com/mountgs/PlanetToken
            org.opencontainers.image.revision=8a9605a0bf1d00dcf1019ab7dfc905609fa618ee
          cache-from: type=gha,scope=upstream-sync-amd64
          cache-to: type=gha,mode=max,scope=upstream-sync-amd64
          provenance: mode=max
          sbom: true
      - name: Record immutable deployment reference
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "ghcr.io/mountgs/planet-token@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "ghcr.io/mountgs/planet-token@${DIGEST}"
