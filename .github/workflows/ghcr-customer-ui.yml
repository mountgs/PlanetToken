name: Publish customer UI image

on:
  push:
    branches: [codex/customer-ui-rightapi]
    paths: [.github/workflows/ghcr-customer-ui.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-customer-ui
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Verify customer UI
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test src/features/pricing/__tests__/customer-selection.test.tsx src/features/pricing/__tests__/dynamic-price.test.ts src/features/pricing/__tests__/task-price-display.test.tsx src/features/pricing/lib/__tests__/customer-pricing.test.ts src/features/contact/__tests__/contact.test.tsx src/features/system-settings/site/__tests__/contact-section.test.tsx src/hooks/__tests__/customer-navigation.test.tsx src/hooks/__tests__/sidebar-config.test.tsx src/features/playground/__tests__/route-access.test.tsx src/features/wallet/__tests__/billing-page.test.tsx src/components/layout/__tests__/customer-theme.test.tsx --maxWorkers=1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Verify affected backend behavior on Linux
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
          go test -p 1 ./router -count=1 -timeout 3m
          go test -p 1 ./controller -run 'TestGetContactRevalidatesAdministratorContent|TestTaskLogDTOHidesMappedModelFromUsers' -count=1 -timeout 3m
          go test -p 1 ./model -run 'TestFormat(User|Admin)Logs' -count=1 -timeout 3m
      - name: Set image version
        id: version
        run: |
          VERSION="customer-ui-20261030-${GITHUB_SHA::9}"
          printf '%s' "$VERSION" > VERSION
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish production architecture
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_SOURCE_URL=https://github.com/mountgs/PlanetToken/tree/${{ github.sha }}
          tags: ghcr.io/mountgs/planet-token:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/mountgs/PlanetToken
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=upstream-sync-amd64
          cache-to: type=gha,mode=max,scope=upstream-sync-amd64
          provenance: mode=max
          sbom: true
      - name: Record immutable deployment reference
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "ghcr.io/mountgs/planet-token@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "ghcr.io/mountgs/planet-token@${DIGEST}"
